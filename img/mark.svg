<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Blue Sky Digital</title>
  <rect width="64" height="64" rx="12" fill="#16324f"/>
  <!-- rising sun over the prairie horizon -->
  <circle cx="32" cy="34" r="13" fill="#c77800"/>
  <rect x="10" y="34" width="44" height="4" rx="2" fill="#6cb4e4"/>
  <!-- sun rays -->
  <g stroke="#c77800" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="12" x2="32" y2="18"/>
    <line x1="16" y1="18" x2="20" y2="22"/>
    <line x1="48" y1="18" x2="44" y2="22"/>
    <line x1="10" y1="34" x2="4" y2="34"/>
    <line x1="54" y1="34" x2="60" y2="34"/>
  </g>
  <!-- prairie grid lines below horizon -->
  <g stroke="#6cb4e4" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="14" y1="46" x2="50" y2="46"/>
    <line x1="20" y1="53" x2="44" y2="53"/>
  </g>
</svg>